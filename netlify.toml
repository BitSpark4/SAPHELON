# Netlify Configuration for SAPHELON Vite + TypeScript SPA
# https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "dist"
  command = "npm run build"

# SPA Routing: rewrites all client-side routes to index.html with a 200 OK status
# Physical files in dist (e.g. assets, images, robots.txt, sitemap.xml, __forms.html) are served directly
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Explicit MIME types for technical SEO crawlers
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"

